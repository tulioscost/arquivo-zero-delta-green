name: Publicar release Foundry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão a publicar, ex.: v1.1.0'
        required: true
        default: 'v1.1.0'
        type: string

permissions:
  contents: write

concurrency:
  group: arquivo-zero-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Obter conteúdo do repositório
        uses: actions/checkout@v4

      - name: Validar módulo e criar instalador Foundry
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import zipfile

          root = pathlib.Path.cwd()
          manifest_path = root / 'module.json'
          if not manifest_path.is_file():
              raise SystemExit('Falta module.json na raiz do repositório')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          tag = os.environ['RELEASE_TAG']
          version = manifest.get('version', '')
          if tag != f'v{version}':
              raise SystemExit(f'Versão incompatível: tag={tag}, module.json={version}')
          if manifest.get('id') != 'arquivo-zero':
              raise SystemExit('ID de módulo inesperado')
          required_files = [
              'module.json', 'README.md', 'LICENSE.md',
              'scripts/module.js', 'styles/arquivo-zero.css',
              'lang/pt-BR.json',
              'data/journals.json', 'data/actors.json',
              'data/items.json', 'data/scenes.json',
          ]
          for name in required_files:
              if not (root / name).is_file():
                  raise SystemExit(f'Arquivo obrigatório ausente: {name}')
          files = list(required_files)
          for folder in ('assets', 'docs'):
              directory = root / folder
              if directory.is_dir():
                  files += [str(p.relative_to(root)) for p in directory.rglob('*') if p.is_file()]
          files = sorted(set(files))
          dist = root / 'dist'
          dist.mkdir(exist_ok=True)
          (dist / 'module.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          zip_path = dist / 'module.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as out:
              for file in files:
                  out.write(root / file, arcname=file)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              invalid = archive.testzip()
              if invalid:
                  raise SystemExit(f'Arquivo ZIP corrompido: {invalid}')
              if 'module.json' not in archive.namelist():
                  raise SystemExit('module.json fora da raiz do ZIP')
              packaged = json.loads(archive.read('module.json'))
              if packaged['version'] != version:
                  raise SystemExit('Versão do ZIP divergente')
          checksum = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / 'SHA256SUMS.txt').write_text(
              f'{checksum}  module.zip\n', encoding='utf-8'
          )
          print(f'Pacote validado: {len(files)} arquivos; versão {version}')
          PY

      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Arquivo Zero $RELEASE_TAG" \
              --notes "Módulo Arquivo Zero para Foundry VTT / Delta Green."
          fi
          gh release upload "$RELEASE_TAG" \
            dist/module.json dist/module.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url: .url, arquivos: [.assets[].name]}'
